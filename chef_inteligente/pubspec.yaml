name: chef_inteligente
description: Um assistente de culinária inteligente com receitas e busca por ingredientes.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Usando uma versão moderna do Dart

# =======================================================
# DEPENDÊNCIAS DE PRODUÇÃO
# =======================================================
dependencies:
  flutter:
    sdk: flutter

  # --- 1. Gerenciamento de Estado ---
  # (Arquitetura)
  provider: ^6.1.2

  # --- 2. Rede e APIs ---
  # (Para buscar dados externos)
  http: ^1.2.1               # Cliente HTTP para a API REST (Spoonacular)
  graphql_flutter: ^5.2.0    # Cliente GraphQL (para o Contentful)
  hive_flutter: ^1.1.0       # Usado pelo graphql_flutter para cache local

  # --- 3. Banco de Dados Local ---
  # (Para salvar favoritos e cache offline)
  sqflite: ^2.3.3            # Plugin do banco de dados SQLite
  path_provider: ^2.1.3      # Para encontrar o caminho do DB no dispositivo
  path: ^1.9.0               # Para manipular caminhos de arquivos

  # --- 4. Utilitários ---
  # (Melhorias de performance e UI)
  cached_network_image: ^3.3.1 # Para cache de imagens de receitas
  cupertino_icons: ^1.0.8      # Ícones padrão do iOS

# =======================================================
# DEPENDÊNCIAS DE DESENVOLVIMENTO
# =======================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Qualidade de Código e Lint ---
  # (Para manter o código padronizado)
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

